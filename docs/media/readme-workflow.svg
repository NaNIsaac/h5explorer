<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="t d">
<title id="t">h5explorer / from HDF5 to a readable map</title><desc id="d">A sample HDF5 group and dataset are inspected using CLI commands and exported as an Excel workbook or JSON.</desc>
<rect x="0" y="0" width="1200" height="510" rx="0" fill="#f7fafc" stroke="#f7fafc" stroke-width="2"/>
<text x="34" y="52" fill="#112c49" font-size="30" font-family="Arial, sans-serif" font-weight="700">h5explorer / from HDF5 to a readable map</text>
<text x="34" y="82" fill="#46657e" font-size="17" font-family="Arial, sans-serif" font-weight="400">Explore the file layout without decompressing or loading measurement arrays.</text>
<rect x="34" y="119" width="332" height="228" rx="18" fill="#ffffff" stroke="#c7d9e8" stroke-width="2"/>
<rect x="47" y="132" width="45" height="40" rx="10" fill="#e9f2fb" stroke="#e9f2fb" stroke-width="2"/>
<text x="59" y="159" fill="#2467a1" font-size="21" font-family="Arial, sans-serif" font-weight="700">1</text>
<text x="103" y="161" fill="#16395c" font-size="22" font-family="Arial, sans-serif" font-weight="700">HDF5 structure</text>
<text x="56" y="210" fill="#35566c" font-size="17" font-family="Consolas, monospace" font-weight="400">sample.h5</text>
<text x="56" y="240" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">/raw</text>
<text x="56" y="270" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">/raw/temperature</text>
<text x="56" y="300" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">shape: (1, 3)</text>
<text x="56" y="330" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">dtype: float64</text>
<rect x="434" y="119" width="332" height="228" rx="18" fill="#ffffff" stroke="#c7d9e8" stroke-width="2"/>
<rect x="447" y="132" width="45" height="40" rx="10" fill="#e9f2fb" stroke="#e9f2fb" stroke-width="2"/>
<text x="459" y="159" fill="#2467a1" font-size="21" font-family="Arial, sans-serif" font-weight="700">2</text>
<text x="503" y="161" fill="#16395c" font-size="22" font-family="Arial, sans-serif" font-weight="700">Inspect metadata</text>
<text x="456" y="210" fill="#35566c" font-size="17" font-family="Consolas, monospace" font-weight="400">h5tree sample.h5</text>
<text x="456" y="240" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">h5explore datasets</text>
<text x="456" y="270" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">h5explore dump</text>
<text x="456" y="300" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">Groups / datasets</text>
<text x="456" y="330" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">Attributes / shape</text>
<rect x="834" y="119" width="332" height="228" rx="18" fill="#ffffff" stroke="#c7d9e8" stroke-width="2"/>
<rect x="847" y="132" width="45" height="40" rx="10" fill="#e9f2fb" stroke="#e9f2fb" stroke-width="2"/>
<text x="859" y="159" fill="#2467a1" font-size="21" font-family="Arial, sans-serif" font-weight="700">3</text>
<text x="903" y="161" fill="#16395c" font-size="22" font-family="Arial, sans-serif" font-weight="700">Export the view</text>
<text x="856" y="210" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">sample.xlsx</text>
<text x="856" y="240" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">structure.json</text>
<text x="856" y="270" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">Tables and summaries</text>
<text x="856" y="300" fill="#35566c" font-size="17" font-family="Arial, sans-serif" font-weight="400">No dataset values read</text>
<path d="M 370 232 H 420 l -14 -9 m 14 9 l -14 9" fill="none" stroke="#6282a1" stroke-width="3"/><path d="M 770 232 H 820 l -14 -9 m 14 9 l -14 9" fill="none" stroke="#6282a1" stroke-width="3"/>
<rect x="34" y="379" width="1132" height="100" rx="15" fill="#172b40" stroke="#172b40" stroke-width="2"/>
<text x="56" y="410" fill="#9bbedb" font-size="14" font-family="Arial, sans-serif" font-weight="700">TERMINAL / REPRODUCIBLE COMMAND</text>
<text x="56" y="446" fill="#e5f3ff" font-size="18" font-family="Consolas, monospace" font-weight="400">h5explore export sample.h5 --output sample.xlsx</text>
<text x="34" y="501" fill="#607b93" font-size="14" font-family="Arial, sans-serif" font-weight="400">Conceptual preview from the README's generated sample; not a captured terminal screenshot.</text></svg>
