[project]
name = "h5explorer"
version = "0.1.0"
description = "Explore the structure and metadata of HDF5 files from Python or the command line"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "h5py>=3.6",
    "pandas>=2.1",
    "numpy>=1.24",
    "rich>=12",
    "click>=8",
    "openpyxl>=3.1",
]
keywords = ["hdf5", "h5py", "metadata", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/h5explorer"
Repository = "https://github.com/NaNIsaac/h5explorer"
Issues = "https://github.com/NaNIsaac/h5explorer/issues"

[project.scripts]
h5explore = "h5explorer.cli:cli"
h5tree = "h5explorer.cli:explore"
h5info = "h5explorer.cli:datasets"

[dependency-groups]
# hdf5plugin only writes the plugin-compressed test files; reading metadata needs no filter.
dev = ["pytest>=8", "hdf5plugin>=5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["h5explorer"]
